<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>食材料理卡｜NIIMBOT B1 測試</title>
  <style>
    :root{--bg:#f6f4ee;--card:#fff;--text:#24231f;--muted:#77736a;--line:#ded9cf;--accent:#315c45;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;}
    main{max-width:720px;margin:auto;padding:18px}
    h1{font-size:1.35rem;margin:.2rem 0 .5rem}
    .lead{color:var(--muted);margin:0 0 16px;line-height:1.6}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
    .status{padding:12px;border-radius:12px;background:#eef3ef;margin:12px 0;white-space:pre-wrap}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:12px;padding:12px 14px;font-size:1rem;background:var(--accent);color:white;cursor:pointer;flex:1;min-width:145px}
    button.secondary{background:#ebe8df;color:var(--text)}
    button:disabled{opacity:.45;cursor:not-allowed}
    video{width:100%;border-radius:14px;background:#111;max-height:50vh;object-fit:cover}
    .hidden{display:none}
    canvas{display:block;max-width:100%;height:auto;margin:12px auto;border:1px solid var(--line);background:#fff}
    code{background:#efede6;padding:2px 5px;border-radius:6px}
    .small{font-size:.9rem;color:var(--muted);line-height:1.5}
    .pill{display:inline-block;padding:4px 8px;background:#ecefe9;border-radius:999px;font-size:.85rem}
  </style>
</head>
<body>
<main>
  <h1>食材 QR → 料理卡 → NIIMBOT B1</h1>
  <p class="lead">Android Chrome 測試版。QR 內容先設定為 <code>FOOD001</code>，對應「小米南瓜粥」。</p>

  <section class="panel">
    <div class="row">
      <button id="connectBtn">① 連接 B1</button>
      <button id="cameraBtn" class="secondary">② 開啟 QR 掃描</button>
    </div>
    <div id="status" class="status">尚未連接印表機。</div>
    <p class="small">第一次連線時 Chrome 會跳出藍牙裝置選擇器，請選你的 NIIMBOT B1。</p>
  </section>

  <section id="scannerPanel" class="panel hidden">
    <span class="pill">掃描模式</span>
    <p>請把食材介紹卡上的 QR Code 對準鏡頭。</p>
    <video id="video" playsinline muted></video>
    <div class="row" style="margin-top:10px">
      <button id="manualBtn" class="secondary">沒有第二台螢幕？模擬掃 FOOD001</button>
      <button id="stopCameraBtn" class="secondary">關閉相機</button>
    </div>
  </section>

  <section id="recipePanel" class="panel hidden">
    <span class="pill">掃描成功</span>
    <h2 id="recipeTitle">小米南瓜粥</h2>
    <p id="ingredientName"></p>
    <canvas id="labelCanvas"></canvas>
    <div class="row">
      <button id="printBtn">③ 列印料理卡</button>
      <button id="resetBtn" class="secondary">重新掃描</button>
    </div>
    <p class="small">本版以 50×170 mm、B1 203 dpi 測試，畫布先設為 384×1360 px。實際進紙長度若有偏差，可再校正。</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@1.3.5/src/niimbot.js"></script>
<script>
(() => {
  const B1_MODEL = {
    label: "Niimbot B1",
    id: 4096,
    dpi: 203,
    protocol: "v4",
    task: "b1",
    density: 3,
    label_type: 1,
    speed: 1,
    name_prefixes: ["B1"]
  };

  // 50×30 mm on B1 is validated as 384×240 px.
  // Feed axis is therefore ~8 px/mm; 170 mm => ~1360 px.
  const LABEL_SIZE = {
    label: "50 × 170 mm (B1 test)",
    code: "T50*170",
    w_mm: 50,
    h_mm: 170,
    w_px: 384,
    h_px: 1360,
    margin: 8,
    offset_y_px: 4,
    dpi: 203
  };

  const RECIPES = {
    FOOD001: {
      ingredient: "小米",
      title: "小米南瓜粥",
      intro: "以小米與南瓜熬煮出溫潤香甜的風味。",
      items: ["小米 50 g", "南瓜 120 g", "水 600 ml", "鹽 少許"],
      steps: ["小米洗淨後浸泡約 20 分鐘", "南瓜去皮切小塊", "小米與水入鍋煮滾", "加入南瓜，小火煮至軟綿", "依喜好加入少許鹽調味"]
    }
  };

  const $ = (id) => document.getElementById(id);
  let stream = null;
  let scanTimer = null;
  let currentCode = null;
  let connected = false;

  function setStatus(msg){ $("status").textContent = msg; }

  function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const chars = [...text];
    let line = "";
    const lines = [];
    for (const ch of chars) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else line = test;
    }
    if (line) lines.push(line);
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    return y + lines.length * lineHeight;
  }

  function drawLabel(recipe) {
    const c = $("labelCanvas");
    c.width = LABEL_SIZE.w_px;
    c.height = LABEL_SIZE.h_px;
    const x = c.getContext("2d");

    x.fillStyle = "#fff";
    x.fillRect(0,0,c.width,c.height);
    x.fillStyle = "#000";
    x.strokeStyle = "#000";
    x.textAlign = "left";
    x.textBaseline = "top";

    const pad = 24;
    let y = 32;

    x.font = "bold 30px sans-serif";
    x.fillText("今日食材料理卡", pad, y);
    y += 54;

    x.lineWidth = 2;
    x.beginPath(); x.moveTo(pad,y); x.lineTo(c.width-pad,y); x.stroke();
    y += 34;

    x.font = "bold 48px sans-serif";
    x.fillText(recipe.ingredient, pad, y);
    y += 72;

    x.font = "bold 38px sans-serif";
    y = wrapText(x, recipe.title, pad, y, c.width-pad*2, 48) + 22;

    x.font = "24px sans-serif";
    y = wrapText(x, recipe.intro, pad, y, c.width-pad*2, 34) + 28;

    x.font = "bold 28px sans-serif";
    x.fillText("準備食材", pad, y);
    y += 44;
    x.font = "24px sans-serif";
    recipe.items.forEach((it) => {
      x.fillText("• " + it, pad+4, y);
      y += 36;
    });
    y += 22;

    x.font = "bold 28px sans-serif";
    x.fillText("料理步驟", pad, y);
    y += 46;
    x.font = "23px sans-serif";
    recipe.steps.forEach((st, idx) => {
      x.font = "bold 23px sans-serif";
      x.fillText(String(idx+1).padStart(2,"0"), pad, y);
      x.font = "23px sans-serif";
      y = wrapText(x, st, pad+46, y, c.width-pad*2-46, 32) + 18;
    });

    const bottom = c.height - 110;
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(pad,bottom); x.lineTo(c.width-pad,bottom); x.stroke();
    x.font = "20px sans-serif";
    x.textAlign = "center";
    x.fillText("掃描食材・帶走一張料理靈感", c.width/2, bottom+28);
    x.font = "16px sans-serif";
    x.fillText("TEST / NIIMBOT B1 / FOOD001", c.width/2, bottom+64);

    return c;
  }

  function showRecipe(code) {
    const recipe = RECIPES[code];
    if (!recipe) {
      setStatus("掃到 QR：" + code + "\n目前測試版沒有這個食材資料。");
      return;
    }
    currentCode = code;
    $("ingredientName").textContent = "今日食材：" + recipe.ingredient + " ｜ QR：" + code;
    $("recipeTitle").textContent = recipe.title;
    drawLabel(recipe);
    $("recipePanel").classList.remove("hidden");
    $("scannerPanel").classList.add("hidden");
    stopCamera();
    setStatus("✓ 已辨識 " + code + " → " + recipe.title + (connected ? "\nB1 已連線，可以列印。" : "\n請先連接 B1，再按列印。"));
  }

  async function connectPrinter() {
    if (!window.Niimbot || !Niimbot.isSupported()) {
      setStatus("此瀏覽器無法使用 Web Bluetooth。\n請用 Android 的 Chrome，並從 HTTPS 網址開啟本頁。");
      return;
    }
    try {
      $("connectBtn").disabled = true;
      setStatus("正在尋找 NIIMBOT B1…\n請在 Chrome 的藍牙清單選擇你的 B1。");
      const info = await Niimbot.identify(B1_MODEL);
      connected = true;
      setStatus(`✓ 已連線：${info.label || "NIIMBOT"}\nModel ID：${info.modelId}\nProtocol：v${info.protocolVersion}`);
      $("connectBtn").textContent = "✓ B1 已連接";
    } catch (e) {
      connected = false;
      setStatus("連線失敗：" + (e.message || e));
    } finally {
      $("connectBtn").disabled = false;
    }
  }

  async function startCamera() {
    $("scannerPanel").classList.remove("hidden");
    $("recipePanel").classList.add("hidden");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("此頁無法取得相機。請確認是 HTTPS，或直接按「模擬掃 FOOD001」測試。");
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      $("video").srcObject = stream;
      await $("video").play();
      setStatus("相機已開啟，請掃描 FOOD001 QR Code。");

      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({formats:["qr_code"]});
        scanTimer = setInterval(async () => {
          try {
            if ($("video").readyState < 2) return;
            const codes = await detector.detect($("video"));
            if (codes.length && codes[0].rawValue) showRecipe(codes[0].rawValue.trim());
          } catch(e) {}
        }, 350);
      } else {
        setStatus("相機已開啟，但此 Chrome 沒有 BarcodeDetector。\n先按「模擬掃 FOOD001」測試列印；之後正式版可加 JS QR 掃描器。");
      }
    } catch(e) {
      setStatus("相機開啟失敗：" + (e.message || e) + "\n你仍可按「模擬掃 FOOD001」。");
    }
  }

  function stopCamera() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if ($("video").srcObject) $("video").srcObject = null;
  }

  async function printRecipe() {
    if (!currentCode || !RECIPES[currentCode]) return;
    if (!window.Niimbot || !Niimbot.isSupported()) {
      setStatus("Web Bluetooth 不可用：請使用 Android Chrome + HTTPS。");
      return;
    }
    try {
      $("printBtn").disabled = true;
      const canvas = drawLabel(RECIPES[currentCode]);
      setStatus("正在傳送料理卡到 B1…");
      await Niimbot.printImage(canvas.toDataURL("image/png"), {
        model: B1_MODEL,
        size: LABEL_SIZE,
        copies: 1,
        onProgress: (p) => setStatus("列印傳輸中：" + p)
      });
      connected = true;
      setStatus("✓ 已送出列印！請查看 B1 是否完整印出 50×170 mm 料理卡。");
    } catch(e) {
      setStatus("列印失敗：" + (e.message || e) + "\n若 B1 有動作但內容不完整，把畫面錯誤訊息告訴我。");
    } finally {
      $("printBtn").disabled = false;
    }
  }

  $("connectBtn").addEventListener("click", connectPrinter);
  $("cameraBtn").addEventListener("click", startCamera);
  $("manualBtn").addEventListener("click", () => showRecipe("FOOD001"));
  $("stopCameraBtn").addEventListener("click", () => { stopCamera(); $("scannerPanel").classList.add("hidden"); });
  $("printBtn").addEventListener("click", printRecipe);
  $("resetBtn").addEventListener("click", () => {
    currentCode = null;
    $("recipePanel").classList.add("hidden");
    startCamera();
  });

  drawLabel(RECIPES.FOOD001);
})();
</script>
</body>
</html>
