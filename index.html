<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>南島文化節｜慢活菜單</title>
<style>
body{font-family:system-ui,"Microsoft JhengHei";max-width:700px;margin:auto;padding:18px;background:#f4f1e9;color:#28251f}
h1{text-align:center;margin-bottom:5px}.sub{text-align:center;color:#756f63}.box{background:#fff;border:1px solid #ddd5c8;border-radius:15px;padding:15px;margin:12px 0}
button{padding:12px 14px;border:0;border-radius:10px;background:#506851;color:#fff;font-size:16px;margin:4px}.secondary{background:#e8e3d9;color:#222}.danger{background:#7b4f4b}.hidden{display:none}
.chips span{display:inline-block;border:1px solid #ddd;padding:6px 9px;border-radius:20px;margin:4px}canvas{display:block;width:min(100%,384px);height:auto;margin:10px auto;border:1px solid #ddd;background:#fff}video{width:100%;border-radius:12px;background:#111}.small{font-size:13px;color:#756f63;line-height:1.5}
#digitalCard{max-width:430px;margin:auto;background:#fff;padding:22px;border-radius:18px}.recipe{border-top:1px solid #ddd;padding:14px 0}.recipe h3{margin:0 0 8px}.saveBtn{width:100%}
</style></head><body>
<h1>南島文化節｜慢活菜單</h1><p class="sub">掃描食材，帶走你的風味菜單</p>
<div id="kiosk">
<section class="box"><button id="scan">掃描食材 QR</button><button id="print">🖨️ 直接列印紙本菜單</button><button id="staffBtn" class="secondary">⚙ 工作人員設定</button><div id="chips" class="chips">尚未加入料理</div><p id="msg">可掃描 FOOD001～FOOD005。</p></section>
<section id="cam" class="box hidden"><video id="video" playsinline></video><button id="closeCam" class="secondary">關閉相機</button></section>
<section class="box"><b>紙本 50 × 170 mm 預覽</b><p class="small">紙本本身包含菜單內容；底部 QR 供民眾開啟電子完整版。</p><canvas id="cv" width="384" height="1360"></canvas></section>
<section id="staff" class="box hidden"><h2>工作人員設定</h2><p id="ps">印表機尚未連接</p><button id="bt">連接／重新連接 B1</button><button id="clear" class="danger">清空目前料理</button><p>模擬掃描：</p>
<button class="secondary sim" data-c="FOOD001">＋小米</button><button class="secondary sim" data-c="FOOD002">＋樹豆</button><button class="secondary sim" data-c="FOOD003">＋紅藜</button><button class="secondary sim" data-c="FOOD004">＋刺蔥</button><button class="secondary sim" data-c="FOOD005">＋南瓜</button><br><button id="closeStaff" class="secondary">關閉設定</button></section>
</div>
<div id="digital" class="hidden"><section id="digitalCard"><h2 style="text-align:center">南島文化節｜我的慢活菜單</h2><div id="digitalRecipes"></div></section><button id="savePng" class="saveBtn">儲存我的菜單圖片 PNG</button><p id="saveMsg" class="small"></p></div>
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@1.3.5/src/niimbot.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const R={
FOOD001:{i:"小米",t:"小米南瓜粥",a:"小米 50g、南瓜 120g、水 600ml、鹽少許",s:["小米洗淨後浸泡","南瓜切塊","加水熬煮至軟綿"]},
FOOD002:{i:"樹豆",t:"樹豆排骨湯",a:"樹豆 80g、排骨 300g、薑片 3片、水 1000ml",s:["樹豆預先浸泡","排骨汆燙","加水燉煮至鬆軟"]},
FOOD003:{i:"紅藜",t:"紅藜野菜炊飯",a:"紅藜 30g、白米 150g、時蔬適量、水適量",s:["紅藜與白米洗淨","加入時蔬","依一般煮飯方式炊煮"]},
FOOD004:{i:"刺蔥",t:"刺蔥煎蛋",a:"刺蔥適量、雞蛋 3顆、鹽少許",s:["刺蔥洗淨切碎","拌入蛋液","煎至兩面金黃"]},
FOOD005:{i:"南瓜",t:"香甜南瓜濃湯",a:"南瓜 250g、洋蔥 1/4顆、水 400ml、牛奶 100ml",s:["南瓜切塊","洋蔥炒香後煮軟","打泥後加入牛奶"]}
};
const MODEL={label:"Niimbot B1",id:4096,dpi:203,protocol:"v4",task:"b1",density:3,label_type:1,speed:1,name_prefixes:["B1"]};
const SIZE={label:"50 × 170 mm",code:"T50*170",w_mm:50,h_mm:170,w_px:384,h_px:1360,margin:8,offset_y_px:4,dpi:203};
let sel=[],stream=null,timer=null,last=Date.now();const $=x=>document.getElementById(x);function touch(){last=Date.now()}
function chips(){$("chips").innerHTML=sel.length?sel.map(c=>"<span>"+R[c].i+"｜"+R[c].t+"</span>").join(""):"尚未加入料理"}
function add(c){touch();if(!R[c])return $("msg").textContent="未知 QR："+c;if(sel.includes(c))return $("msg").textContent=R[c].i+" 已加入，不重複累積。";sel.push(c);chips();renderPaper();$("msg").textContent="已加入 "+R[c].i+"，目前 "+sel.length+" 道。";stopCamera()}
function clearAll(t="已清空，請掃描第一張食材卡。"){sel=[];chips();drawPaper();$("msg").textContent=t;touch()}
function menuURL(){return location.origin+location.pathname+"?menu="+encodeURIComponent(sel.join(","))}
function drawPaper(){let c=$("cv"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,384,1360);x.fillStyle="#000";x.strokeStyle="#000";x.textBaseline="top";x.textAlign="center";x.font="bold 28px sans-serif";x.fillText("南島文化節",192,25);x.font="bold 35px sans-serif";x.fillText("慢活菜單",192,65);x.beginPath();x.moveTo(20,115);x.lineTo(364,115);x.stroke();if(!sel.length){x.font="21px sans-serif";x.fillText("掃描食材後，紙本菜單顯示於此",192,170);return}let top=140,bottom=1110,b=(bottom-top)/sel.length;sel.forEach((c,n)=>{let r=R[c],y=top+n*b;x.textAlign="left";x.font="bold "+(sel.length<=2?30:24)+"px sans-serif";x.fillText(r.i+"｜"+r.t,20,y+5);x.font=(sel.length<=2?20:17)+"px sans-serif";x.fillText("食材："+r.a,20,y+48);let max=sel.length<=2?3:sel.length<=4?2:1;r.s.slice(0,max).forEach((s,j)=>x.fillText((j+1)+". "+s,20,y+82+j*29));if(n<sel.length-1){x.beginPath();x.moveTo(20,y+b-8);x.lineTo(364,y+b-8);x.stroke()}});x.textAlign="center";x.beginPath();x.moveTo(20,1135);x.lineTo(364,1135);x.stroke();x.font="17px sans-serif";x.fillText("掃描 QR 收藏完整電子菜單",192,1155)}
function renderPaper(){drawPaper();if(!sel.length)return;let h=document.createElement("div");h.style.position="absolute";h.style.left="-9999px";document.body.appendChild(h);new QRCode(h,{text:menuURL(),width:150,height:150,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{let q=h.querySelector("canvas"),im=h.querySelector("img"),x=$("cv").getContext("2d");if(q){x.drawImage(q,117,1195,150,150);h.remove()}else if(im){let i=new Image();i.onload=()=>{x.drawImage(i,117,1195,150,150);h.remove()};i.src=im.src}},150)}
async function startCamera(){touch();$("cam").classList.remove("hidden");try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});$("video").srcObject=stream;await $("video").play();if("BarcodeDetector"in window){let d=new BarcodeDetector({formats:["qr_code"]});timer=setInterval(async()=>{try{let a=await d.detect($("video"));if(a.length)add(a[0].rawValue.trim())}catch(e){}},400)}}catch(e){$("msg").textContent="相機錯誤："+e.message}}
function stopCamera(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("cam").classList.add("hidden")}
async function connect(){try{$("ps").textContent="尋找 B1…";let i=await Niimbot.identify(MODEL);$("ps").textContent="✓ 已連接 "+(i.label||"B1")}catch(e){$("ps").textContent="連線失敗："+e.message}}
async function printAll(){if(!sel.length)return $("msg").textContent="請先掃描至少一個食材。";try{renderPaper();await new Promise(r=>setTimeout(r,350));$("msg").textContent="正在確認 B1…";await Niimbot.identify(MODEL);$("msg").textContent="正在列印紙本菜單…";await Niimbot.printImage($("cv").toDataURL("image/png"),{model:MODEL,size:SIZE,copies:1});$("msg").textContent="✓ 列印完成，5 秒後自動清空。";setTimeout(()=>clearAll("已清空，下一位可以開始。"),5000)}catch(e){$("msg").textContent="列印失敗："+e.message}}
function electronic(){let m=new URLSearchParams(location.search).get("menu");if(!m)return false;let codes=[...new Set(m.split(",").filter(c=>R[c]))];if(!codes.length)return false;$("kiosk").classList.add("hidden");$("digital").classList.remove("hidden");$("digitalRecipes").innerHTML=codes.map((c,n)=>{let r=R[c];return `<div class="recipe"><h3>${String(n+1).padStart(2,"0")} ${r.i}｜${r.t}</h3><b>準備食材</b><p>${r.a}</p><b>料理步驟</b><ol>${r.s.map(s=>`<li>${s}</li>`).join("")}</ol></div>`}).join("");return true}
$("savePng").onclick=async()=>{try{$("saveMsg").textContent="正在生成圖片…";let c=await html2canvas($("digitalCard"),{scale:2,backgroundColor:"#ffffff"});let a=document.createElement("a");a.download="南島文化節_我的慢活菜單.png";a.href=c.toDataURL("image/png");a.click();$("saveMsg").textContent="✓ PNG 已產生，可保存至手機。"}catch(e){$("saveMsg").textContent="圖片產生失敗："+e.message}};
$("scan").onclick=startCamera;$("closeCam").onclick=stopCamera;$("print").onclick=printAll;$("staffBtn").onclick=()=>$("staff").classList.remove("hidden");$("bt").onclick=connect;$("clear").onclick=()=>{if(confirm("確定清空目前料理？"))clearAll()};$("closeStaff").onclick=()=>$("staff").classList.add("hidden");document.querySelectorAll(".sim").forEach(b=>b.onclick=()=>add(b.dataset.c));
setInterval(()=>{if(sel.length&&Date.now()-last>60000&&!new URLSearchParams(location.search).get("menu"))clearAll("60 秒未操作，已自動清空。")},5000);if(!electronic()){chips();drawPaper()}
</script></body></html>
